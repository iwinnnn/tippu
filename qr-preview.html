<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open on Phone — QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f5f2eb;
      color: #161513;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(22, 21, 19, 0.08);
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.08);
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      font: 600 11px/1 'JetBrains Mono', monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2a9d8f;
      background: rgba(42, 157, 143, 0.12);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #888177;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .qr-wrap {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(22, 21, 19, 0.08);
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .qr-wrap img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .url-box {
      background: #f5f2eb;
      border: 1px solid rgba(22, 21, 19, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
      font: 600 14px/1.3 'JetBrains Mono', monospace;
      color: #161513;
      user-select: all;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .note {
      font-size: 12px;
      color: #888177;
      line-height: 1.4;
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      font: 600 12px/1 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
      background: #161513;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 9999px;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      background: #2a9d8f;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Live on Local Network</span>
    <h1>Scan with Phone</h1>
    <p>Make sure your phone is connected to the same Wi-Fi network.</p>

    <div class="qr-wrap">
      <img src="qr.svg" alt="Scan QR Code to open on phone" />
    </div>

    <div class="url-box">http://10.28.12.32:8000</div>
    <div class="note">Or on Ethernet network: <br><code>http://10.20.1.156:8000</code></div>

    <a href="index.html" class="btn">Open Main Site →</a>
  </div>
</body>
</html>
